<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b1530">
  <title>Dünya'nın Katmanları AR</title>
  <meta name="description" content="5. sınıf Fen kitabı 18. sayfa: Dünya görselinin üzerinde artırılmış gerçeklik ile Dünya'nın katmanları.">
  <style>
    :root {
      --bg: #0b1530;
      --panel: rgba(255, 255, 255, 0.95);
      --ink: #1f1f1f;
      --accent: #f28c1f;
      --accent-ink: #d9660d;
      --hint-bg: rgba(0, 0, 0, 0.55);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--bg); color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-user-select: none; user-select: none; touch-action: none;
    }
    #ar { position: fixed; inset: 0; }
    #hint {
      position: fixed; top: max(16px, env(safe-area-inset-top)); left: 16px; right: 16px; z-index: 5;
      padding: 10px 12px; border-radius: 12px; background: var(--hint-bg);
      font-weight: 700; font-size: 15px; text-align: center; display: none;
    }
    #info {
      position: fixed; left: 12px; right: 12px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 5;
      padding: 12px 16px 14px; border-radius: 16px; background: var(--panel); color: var(--ink);
      display: none; transition: opacity .2s;
    }
    #info h2 { margin: 0 0 4px; font-size: 21px; color: var(--accent-ink); }
    #info p { margin: 0; font-size: 16px; line-height: 1.4; }
    #start {
      position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; padding: 24px 16px; text-align: center;
      background: radial-gradient(circle at 50% 35%, #1d3b7a 0%, var(--bg) 70%);
    }
    #start img { width: min(46vw, 200px); height: auto; border-radius: 50%; }
    #start h1 { margin: 0; font-size: 26px; }
    #start p { margin: 0; max-width: 420px; font-size: 16px; line-height: 1.45; opacity: .9; }
    #go {
      font: inherit; font-size: 18px; font-weight: 700; color: #fff; background: var(--accent);
      border: 0; border-radius: 14px; padding: 14px 28px; cursor: pointer;
    }
    #go:disabled { opacity: .6; }
    #err { color: #ffb4a0; font-size: 15px; max-width: 420px; }
    #start small { opacity: .7; font-size: 13px; }
    #start a { color: #ffd29a; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
</head>
<body>
  <div id="ar"></div>
  <div id="hint"></div>
  <div id="info"><h2></h2><p></p></div>

  <div id="start">
    <img src="hedef.png" alt="Kitaptaki Dünya görseli">
    <h1>Dünya'nın Katmanları</h1>
    <p>Fen kitabının <b>18. sayfasındaki</b> Dünya görselini kameraya gösterin; görselin üzerinde Dünya'nın katmanları 3D olarak belirecek.</p>
    <button id="go">Kamerayı Aç</button>
    <div id="err"></div>
    <small>Kitabınız yanınızda değilse <a href="hedef.png" target="_blank">bu görseli</a> başka bir ekranda açıp deneyebilirsiniz.</small>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
